# TEMPORARY SPIKE: proves environment secrets are released only to main. Uses a dummy value, not a credential.
name: s4-secret-probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Report whether the environment secret reached this job (never prints it)
        env:
          V: ${{ secrets.SPIKE_DUMMY }}
        run: |
          echo "ref=$GITHUB_REF"
          if [ -n "$V" ]; then echo "secret_present=yes length=${#V}"; else echo "secret_present=no"; fi
