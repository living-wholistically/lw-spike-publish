# TEMPORARY SPIKE WORKFLOW. Throwaway test only; no secrets, no production code.
name: publish-spike

on:
  workflow_dispatch: {}   # deliberately NO inputs: a caller cannot pass anything in

permissions:
  contents: read

concurrency:
  group: publish-spike
  cancel-in-progress: false

jobs:
  guard-and-record:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on anything but main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Refusing to run on $GITHUB_REF; only refs/heads/main is allowed."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record what ran
        run: |
          echo "commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "ref: $GITHUB_REF" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run: $GITHUB_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
